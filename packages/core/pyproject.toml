[project]
name = "app-core"
version = "0.1.0"
description = "Shared models, settings, tenancy and brand for the API and workers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "structlog>=24.4",
    "nh3>=0.2.18",
    "requests>=2.32",
    "httpx>=0.28",
    "cryptography>=43.0",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_core"]
