[project]
name = "app-api"
version = "0.1.0"
description = "HTTP API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "app-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "redis>=5.2",
    "sentry-sdk[fastapi]>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_api"]
