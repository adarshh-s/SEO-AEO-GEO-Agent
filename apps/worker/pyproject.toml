[project]
name = "app-worker"
version = "0.1.0"
description = "Celery workers and beat."
requires-python = ">=3.12,<3.13"
dependencies = [
    "app-core",
    "celery[redis]>=5.4",
    "sentry-sdk[celery]>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_worker"]
