# Railway config-as-code for the API service.
# In the service's Settings → Config-as-code, set the path to /infra/railway/api.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/api.Dockerfile"
watchPatterns = ["apps/api/**", "packages/core/**", "config/**", "uv.lock", "infra/docker/api.Dockerfile"]

[deploy]
# The image CMD runs `alembic upgrade head` and then uvicorn on $PORT.
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
